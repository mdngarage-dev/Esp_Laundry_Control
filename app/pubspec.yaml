name: dryer_app
description: Kontrol, setting, dan kalibrasi dryer / mesin cuci lewat BLE
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0   # tetap di 1.x (API di kode ini untuk 1.x)
  shared_preferences: ^2.2.0
  flutter_launcher_icons: ^0.14.3
  mobile_scanner: ^5.2.3       # scan barcode order laundry

  firebase_core: ^4.10.0 
  cloud_firestore: ^6.5.0
  permission_handler: ^12.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: Pastrami
      fonts:
        - asset: assets/font/Font.ttf
          weight: 700

  assets:
    - assets/tutorial/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/icon/icon.png"

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"